# Verzio: v0.1.0 - 2026-09-21
# Az Android/ mappa debug APK-jat epiti. Csak akkor fut, ha az
# Android/ vagy ez a fajl valtozik (vagy kezzel: Actions -> Android build -> Run workflow).
name: Android build

on:
  push:
    paths:
      - "Android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Nincs Gradle wrapper a repoban (a wrapper .jar binaris) - a Gradle-t a setup-gradle telepiti.
      # A 8.7 az AGP 8.5.2-hoz illo Gradle-verzio.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # Az APK fajlneve ALLANDO (NetworkTools.apk) - a verzio az appban (fejlec/Nevjegy) es a naplokban latszik.
      - name: Name APK
        run: |
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Network Tool's verzio: $VERSION"
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NetworkTools.apk

      # Diagnosztika: az APK alairo tanusitvanyanak ujjlenyomata. Frissites (in-place) csak akkor
      # telepul, ha ez futasrol futasra UGYANAZ.
      - name: Print APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/NetworkTools.apk | grep -i "SHA-256\|SHA-1\|Signer #1" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: networktools-debug-apk
          path: Android/app/build/outputs/apk/debug/NetworkTools.apk
